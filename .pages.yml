            - NAS
            - OpenWrt
            - PVE
            - Python
            - QT
            - rsa-key
            - Sipeed
            - Software
            - SSD
            - ssh
            - Teardown
            - Theme
            - Tobii
            - ubuntu
            - VLAN
            - Vocechat
            - WES
            - WiFi-7
            - WireGuard
            - 短视频
            - 广告拦截
            - 开始
            - 开源
            - 幕后
            - 故障解决
            - 缓存策略
            - 群晖
            - 网管交换机
            - 网络
            - 虚拟机
            - 证书
            - 组网

      - name: body
        label: 正文
        type: rich-text

  # =============================================================== 关于页
  - name: about
    label: 「关于」页
    type: file
    path: source/about/index.md
    fields:
      - name: title
        label: 页面标题
        type: string

      - name: layout
        label: 版式（别改）
        type: string
        readonly: true
        description: "必须保持 about，改了页面就散架。"

      - name: comments
        label: 显示评论区
        type: boolean

      - name: body
        label: 正文
        type: rich-text
